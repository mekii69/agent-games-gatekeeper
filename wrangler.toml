name = "agent-games-gatekeeper"
main = "src/index.js"
compatibility_date = "2026-11-15"

# Workers KV is required for reliable PROOF_REUSED detection + idempotency.
# Create it after the first deploy (needs Cloudflare auth):
#   wrangler kv namespace create GATEKEEPER_KV
# then uncomment the block below, paste the returned id, and redeploy.
# Until then the Worker falls back to an in-memory store (works, but does not
# survive isolate restarts — see GET /health kvConfigured flag).
 [[kv_namespaces]]
 binding = "GATEKEEPER_KV"
 id = "a0f110fe51104973a2f6776c62af5973"
